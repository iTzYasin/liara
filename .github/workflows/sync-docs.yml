name: Sync Liara docs index

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:sync
      - name: Commit a verified index change
        run: |
          if git diff --quiet -- data/liara-docs-index.json; then
            echo "Docs index is already current."
            exit 0
          fi
          npm test -- --run src/modules/retrieval/golden-set.test.ts
          git config user.name "liara-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/liara-docs-index.json
          git commit -m "chore: sync Liara docs index"
          git push
